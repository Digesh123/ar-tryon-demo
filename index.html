<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ring Try-On</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body, html {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: black;
    }

    video, canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .ui {
      position: absolute;
      bottom: 20px;
      width: 100%;
      text-align: center;
      z-index: 10;
    }

    button {
      padding: 12px 20px;
      background: gold;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <video id="video" autoplay playsinline muted></video>
  <canvas id="overlay"></canvas>

  <div class="ui">
    <button id="switchCam">Switch Camera</button>
  </div>

  <!-- IMPORTANT -->
  <script type="module" src="main1.js"></script>
</body>
</html>
