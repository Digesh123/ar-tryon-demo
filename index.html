<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ring Try-On</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Styles -->
  <link rel="stylesheet" href="style.css" />

  <!-- Three.js (ONE instance only) -->
  <script src="https://unpkg.com/three@0.152.2/build/three.min.js"></script>

  <!-- GLTFLoader (must match same Three.js version) -->
  <script src="https://unpkg.com/three@0.152.2/examples/js/loaders/GLTFLoader.js"></script>

  <!-- MediaPipe -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
</head>

<body>
  <!-- Camera feed -->
  <video id="video" autoplay playsinline muted></video>

  <!-- Three.js overlay -->
  <canvas id="overlay"></canvas>

  <!-- Controls -->
  <div class="ui">
    <button id="switchCam">Switch Camera</button>
  </div>

  <!-- App logic (MUST be last) -->
  <script src="app.js"></script>
</body>
</html>
