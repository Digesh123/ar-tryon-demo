<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Jewellery AR Try-On</title>

  <!-- Required for mobile -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Google model-viewer (WebAR engine) -->
  <script
    type="module"
    src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
  </script>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- Header -->
  <div class="top-bar">
    <span>Try Jewellery in AR</span>
  </div>

  <!-- AR Viewer -->
  <model-viewer
    id="arViewer"
    src="assets/ring.glb"
    ar
    ar-modes="scene-viewer webxr quick-look"
    camera-controls
    auto-rotate
    exposure="1"
    shadow-intensity="1"
    environment-image="neutral"
    style="width: 100%; height: calc(100vh - 60px);"
  >
  </model-viewer>

  <!-- CTA -->
  <div class="bottom-bar">
    <button id="tryNowBtn">View in Your Space</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
